<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Signiq Birch PDRN Hydration Glow Serum aggregate review data</title>
  <desc id="desc">Data card showing skincare sales rank 31, a 5.0 rating from 1,335 review records, a displayed 100 percent five-star share, and no usable shopper poll distribution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8f3"/><stop offset="1" stop-color="#dcefe8"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2b7b68"/><stop offset="1" stop-color="#61aa8e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#153b31" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="95" r="170" fill="#b7dece" opacity=".45"/><circle cx="70" cy="590" r="220" fill="#c9e7dc" opacity=".6"/>
  <g filter="url(#shadow)"><rect x="70" y="58" width="1060" height="514" rx="34" fill="#fff"/></g>
  <text x="120" y="124" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#2b7b68">OLIVE YOUNG KOREA · CAPTURED 2026-11-25</text>
  <text x="120" y="180" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#173b34">Signiq Birch PDRN</text>
  <text x="120" y="225" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#173b34">Hydration Glow Serum</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="120" y="272" width="270" height="126" rx="22" fill="#edf7f2"/><text x="150" y="312" font-size="20" fill="#547068">SKINCARE RANK</text><text x="150" y="370" font-size="55" font-weight="700" fill="#215f51">#31</text>
    <rect x="420" y="272" width="270" height="126" rx="22" fill="#edf7f2"/><text x="450" y="312" font-size="20" fill="#547068">AVERAGE</text><text x="450" y="370" font-size="55" font-weight="700" fill="#215f51">5.0 / 5</text>
    <rect x="720" y="272" width="360" height="126" rx="22" fill="#edf7f2"/><text x="750" y="312" font-size="20" fill="#547068">REVIEW RECORDS</text><text x="750" y="370" font-size="55" font-weight="700" fill="#215f51">1,335</text>
    <text x="120" y="448" font-size="20" fill="#547068">DISPLAYED FIVE-STAR SHARE</text><rect x="120" y="466" width="650" height="24" rx="12" fill="#dcebe5"/><rect x="120" y="466" width="650" height="24" rx="12" fill="url(#bar)"/><text x="790" y="488" font-size="28" font-weight="700" fill="#215f51">100%</text>
    <rect x="120" y="520" width="960" height="38" rx="19" fill="#f5f2e9"/><text x="600" y="546" text-anchor="middle" font-size="18" fill="#685f48">Shopper-poll rows displayed 0% across every option; no usable poll distribution was inferred.</text>
