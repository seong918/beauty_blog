<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Favorite Smooth Cream aggregate review data</title>
  <desc id="desc">Skincare sales rank 10, 5.0 stars from 548 records, 100 percent five-star, dry and combination skin tied at 46 percent, hydration concern 81 percent, and gentle response 93 percent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f2e8"/>
      <stop offset="1" stop-color="#e6efe8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#244236" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="150" fill="#b7d0bd" opacity=".32"/>
  <circle cx="90" cy="560" r="180" fill="#e3c8aa" opacity=".28"/>
  <text x="70" y="82" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#587064">OLIVE YOUNG KOREA SNAPSHOT</text>
  <text x="70" y="142" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#17382d">Favorite Smooth Cream</text>
  <text x="70" y="180" font-family="Arial, sans-serif" font-size="24" fill="#50645b">Captured November 14, 2026 · skincare sales rank 10</text>
  <g filter="url(#shadow)">
    <rect x="70" y="220" width="320" height="240" rx="24" fill="#fff"/>
    <rect x="420" y="220" width="330" height="240" rx="24" fill="#fff"/>
    <rect x="780" y="220" width="350" height="240" rx="24" fill="#fff"/>
  </g>
  <text x="110" y="278" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#64786e">AGGREGATE RATING</text>
  <text x="110" y="354" font-family="Arial, sans-serif" font-size="68" font-weight="800" fill="#214f3b">5.0</text>
  <text x="245" y="350" font-family="Arial, sans-serif" font-size="34" fill="#d49c42">★★★★★</text>
  <text x="110" y="405" font-family="Arial, sans-serif" font-size="25" fill="#43584e">548 review records</text>
  <text x="110" y="438" font-family="Arial, sans-serif" font-size="21" fill="#6c7d75">5-star row: 100%</text>
  <text x="460" y="278" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#64786e">LEADING POLL SHARES</text>
  <text x="460" y="326" font-family="Arial, sans-serif" font-size="24" fill="#314b40">Dry skin</text>
  <text x="705" y="326" text-anchor="end" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#214f3b">46%</text>
  <text x="460" y="373" font-family="Arial, sans-serif" font-size="24" fill="#314b40">Combination skin</text>
  <text x="705" y="373" text-anchor="end" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#214f3b">46%</text>
  <text x="460" y="420" font-family="Arial, sans-serif" font-size="24" fill="#314b40">Hydration</text>
  <text x="705" y="420" text-anchor="end" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#214f3b">81%</text>
  <text x="820" y="278" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#64786e">GENTLENESS POLL</text>
  <text x="820" y="355" font-family="Arial, sans-serif" font-size="70" font-weight="800" fill="#214f3b">93%</text>
  <text x="820" y="401" font-family="Arial, sans-serif" font-size="25" fill="#43584e">selected “gentle”</text>
  <text x="820" y="438" font-family="Arial, sans-serif" font-size="20" fill="#6c7d75">5% ordinary · 1% felt irritation</text>
  <text x="70" y="535" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#314b40">Retailer-displayed aggregates are not clinical evidence.</text>
  <text x="70" y="570" font-family="Arial, sans-serif" font-size="20" fill="#60736a">Rounded polls describe the captured response sample, not proven product fit or universal tolerance.</text>
</svg>
