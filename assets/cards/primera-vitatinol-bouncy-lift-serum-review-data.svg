    <g transform="translate(335 298)"><rect width="245" height="190" rx="22" fill="#fff" opacity=".9"/><text x="24" y="48" fill="#767969" font-size="20">RATING</text><text x="24" y="118" fill="#2f3c25" font-size="60" font-weight="700">4.8<tspan font-size="28"> / 5</tspan></text><text x="24" y="158" fill="#767969" font-size="20">6,161 records</text></g>
