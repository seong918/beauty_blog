    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e7b33f"/><stop offset="1" stop-color="#7ca35c"/></linearGradient>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1080" cy="95" r="150" fill="#f4cf69" opacity=".22"/>
  <circle cx="1030" cy="570" r="190" fill="#87ac69" opacity=".18"/>
