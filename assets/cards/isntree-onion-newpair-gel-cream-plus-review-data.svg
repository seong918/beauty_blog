  <text x="72" y="548" font-family="system-ui,sans-serif" font-size="21" fill="#68606a">Captured 2026-08-23 · Polls describe perceptions, not clinical outcomes.</text><text x="72" y="584" font-family="system-ui,sans-serif" font-size="18" fill="#817983">Star-by-star distribution was not reliably exposed, so none is estimated.</text>
