  <text x="110" y="245" font-family="system-ui,sans-serif" font-size="22" font-weight="650" fill="#776d79">DISPLAYED AVERAGE</text><text x="110" y="352" font-family="system-ui,sans-serif" font-size="106" font-weight="800" fill="#785582">4.8</text><text x="313" y="350" font-family="system-ui,sans-serif" font-size="38" font-weight="700" fill="#aa8146">★</text><text x="110" y="430" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#423947">5,024 records</text>
  <text x="474" y="225" font-family="system-ui,sans-serif" font-size="20" font-weight="650" fill="#776d79">DISPLAYED REVIEW POLLS</text><text x="474" y="284" font-family="system-ui,sans-serif" font-size="31" font-weight="750" fill="#433649">Combination skin</text><text x="1050" y="284" text-anchor="end" font-family="system-ui,sans-serif" font-size="44" font-weight="800" fill="#785582">53%</text>
