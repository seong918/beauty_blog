<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Isntree Onion Newpair Gel Cream Plus aggregate review data</title>
  <desc id="desc">Data card showing 4.8 stars from 5,024 Olive Young Korea review records, 53 percent combination skin, 47 percent soothing concern, and 77 percent gentle response, captured August 23, 2026.</desc>
