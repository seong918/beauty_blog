  <rect width="1200" height="630" fill="url(#bg)"/><circle cx="1080" cy="80" r="190" fill="#e5d3e8" opacity=".7"/><circle cx="80" cy="600" r="170" fill="#eadbd3" opacity=".65"/>
  <text x="72" y="80" font-family="system-ui,sans-serif" font-size="25" font-weight="700" letter-spacing="3" fill="#765f7b">RETAIL REVIEW SNAPSHOT</text>
  <text x="72" y="132" font-family="system-ui,sans-serif" font-size="38" font-weight="760" fill="#342b37">Isntree Onion Newpair Gel Cream Plus</text>
