<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">IOPE XMD Stem3 Clinical Recovery Serum aggregate review data</title>
  <desc id="desc">A data card showing a 4.9 rating from 1,837 Olive Young Korea review records, with displayed poll shares of 50 percent combination skin, 62 percent hydration concern, and 73 percent gentle response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6ef"/>
      <stop offset="1" stop-color="#e8eee7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f8060"/>
      <stop offset="1" stop-color="#91a77e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#33412f" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="-10" r="250" fill="#dbe6d7" opacity=".62"/>
  <circle cx="60" cy="640" r="220" fill="#eee4d5" opacity=".65"/>
  <text x="70" y="76" fill="#6b7464" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3">K-BEAUTY DATA DESK</text>
  <text x="70" y="145" fill="#273126" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">IOPE XMD Stem3</text>
  <text x="70" y="196" fill="#273126" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">Clinical Recovery Serum</text>
  <text x="70" y="237" fill="#667062" font-family="Arial, Helvetica, sans-serif" font-size="20">Olive Young Korea aggregate snapshot · 2026-08-20</text>
  <g filter="url(#shadow)">
    <rect x="70" y="282" width="330" height="246" rx="26" fill="#ffffff"/>
    <text x="102" y="329" fill="#788171" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">DISPLAYED RATING</text>
    <text x="100" y="428" fill="#45583e" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800">4.9</text>
    <text x="274" y="425" fill="#7c8b72" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">/ 5</text>
    <text x="102" y="486" fill="#4b5548" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">1,837 review records</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="430" y="282" width="700" height="246" rx="26" fill="#ffffff"/>
    <text x="462" y="329" fill="#788171" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">DISPLAYED REVIEW POLLS</text>
    <text x="462" y="386" fill="#3f493d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Combination skin</text>
    <rect x="710" y="365" width="320" height="24" rx="12" fill="#e5e9e1"/>
    <rect x="710" y="365" width="160" height="24" rx="12" fill="url(#accent)"/>
    <text x="1050" y="386" fill="#45583e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">50%</text>
    <text x="462" y="444" fill="#3f493d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Hydration concern</text>
    <rect x="710" y="423" width="320" height="24" rx="12" fill="#e5e9e1"/>
    <rect x="710" y="423" width="198" height="24" rx="12" fill="url(#accent)"/>
    <text x="1050" y="444" fill="#45583e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">62%</text>
    <text x="462" y="502" fill="#3f493d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Gentle response</text>
    <rect x="710" y="481" width="320" height="24" rx="12" fill="#e5e9e1"/>
    <rect x="710" y="481" width="234" height="24" rx="12" fill="url(#accent)"/>
    <text x="1050" y="502" fill="#45583e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">73%</text>
  </g>
  <text x="70" y="585" fill="#6f776b" font-family="Arial, Helvetica, sans-serif" font-size="17">Aggregate signals describe the captured review pool; they do not prove efficacy or predict individual tolerance.</text>
</svg>
