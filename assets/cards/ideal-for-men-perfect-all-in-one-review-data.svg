<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ideal For Men Perfect All-in-One aggregate review data</title>
  <desc id="desc">A code-drawn data card showing 4.9 stars across 20,152 records, 88 percent five-star, 64 percent combination skin, 61 percent hydration concern, and 61 percent gentle response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eff4e8"/><stop offset="1" stop-color="#dce7cf"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#27321d" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="105" r="210" fill="#c9d9b9" opacity=".7"/>
  <circle cx="75" cy="590" r="170" fill="#f8faf4" opacity=".9"/>
  <g filter="url(#shadow)"><rect x="72" y="72" width="1056" height="486" rx="34" fill="#fff"/></g>
  <text x="120" y="135" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#596349" letter-spacing="2">CAPTURED RETAIL AGGREGATE · 17 SEP 2026</text>
  <text x="120" y="196" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#20251d">Ideal For Men Perfect All-in-One</text>
  <text x="120" y="292" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="800" fill="#4d672f">4.9</text>
  <text x="335" y="275" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#637056">out of 5</text>
  <text x="338" y="319" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#5d6655">20,152 displayed review records</text>
  <g transform="translate(120 385)">
    <rect width="280" height="108" rx="18" fill="#eef5e8"/>
    <text x="24" y="43" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#596349">FIVE-STAR SHARE</text>
    <text x="24" y="86" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800" fill="#36531d">88%</text>
  </g>
  <g transform="translate(430 385)">
    <rect width="280" height="108" rx="18" fill="#eef5e8"/>
    <text x="24" y="43" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#596349">COMBINATION</text>
    <text x="24" y="86" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800" fill="#36531d">64%</text>
  </g>
  <g transform="translate(740 385)">
    <rect width="340" height="108" rx="18" fill="#eef5e8"/>
    <text x="24" y="43" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#596349">HYDRATION / GENTLE</text>
    <text x="24" y="86" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800" fill="#36531d">61% / 61%</text>
  </g>
  <text x="120" y="535" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#70786a">Displayed shares are rounded storefront values, not measured outcomes.</text>
</svg>
