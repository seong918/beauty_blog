<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Medicube AGE-R Booster Pro X2 aggregate review data</title>
  <desc id="desc">Code-drawn card showing skincare rank 10, a 5.0 rating from 53 review records, 98 percent five-star, and no usable shopper polls exposed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e8f4f5"/><stop offset="1" stop-color="#e8e8ef"/></linearGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop stop-color="#427e87"/><stop offset="1" stop-color="#79aeb3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#25474c" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/><circle cx="1085" cy="90" r="180" fill="#fff" opacity=".3"/><circle cx="100" cy="600" r="190" fill="#fff" opacity=".28"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" fill="#263438">
    <text x="70" y="78" font-size="24" font-weight="700" letter-spacing="2">THE K-BEAUTY DATA DESK</text>
    <text x="70" y="130" font-size="44" font-weight="800">Medicube AGE-R Booster Pro X2</text>
    <text x="70" y="168" font-size="22" fill="#576c71">Olive Young Korea aggregate display · captured 2026-10-31</text>
    <g transform="translate(70 215)" filter="url(#shadow)"><rect width="320" height="250" rx="22" fill="#fff"/><text x="28" y="48" font-size="18" fill="#64777b">SKINCARE SALES RANK</text><text x="28" y="115" font-size="66" font-weight="800">#10</text><text x="28" y="164" font-size="18" fill="#64777b">DISPLAYED RATING</text><text x="28" y="220" font-size="48" font-weight="800">5.0 <tspan font-size="24" font-weight="600">/ 5</tspan></text></g>
    <g transform="translate(425 215)" filter="url(#shadow)"><rect width="705" height="250" rx="22" fill="#fff"/><text x="30" y="48" font-size="22" font-weight="700">53 review records</text><text x="30" y="91" font-size="18" fill="#64777b">DISPLAYED STAR SHARES</text><rect x="30" y="112" width="645" height="18" rx="9" fill="#e8edee"/><rect x="30" y="112" width="632" height="18" rx="9" fill="url(#bar)"/><text x="30" y="169" font-size="28" font-weight="800">98% five-star</text><text x="30" y="208" font-size="18" fill="#64777b">No usable skin, concern, irritation, or theme panel exposed</text></g>
    <text x="70" y="525" font-size="20" font-weight="700">Strong early retail rating · small review base</text>
    <text x="70" y="561" font-size="18" fill="#576c71">Retail signals, not clinical, safety, durability, or effectiveness evidence.</text>
  </g>
</svg>
