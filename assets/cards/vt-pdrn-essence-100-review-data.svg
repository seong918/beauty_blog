  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="145" fill="#fff" opacity=".36"/><circle cx="90" cy="570" r="170" fill="#b9dcdb" opacity=".3"/>
  <text x="72" y="86" font-family="Arial, sans-serif" font-size="24" fill="#3b666b" letter-spacing="3">THE K-BEAUTY DATA DESK</text>
  <text x="72" y="146" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#17363b">VT PDRN Essence 100</text>
