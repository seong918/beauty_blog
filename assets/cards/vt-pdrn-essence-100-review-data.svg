  <text x="112" y="282" font-family="Arial, sans-serif" font-size="19" fill="#587176">SKINCARE SALES RANK</text><text x="112" y="390" font-family="Arial, sans-serif" font-size="108" font-weight="700" fill="#2e7881">#2</text><text x="112" y="448" font-family="Arial, sans-serif" font-size="24" fill="#536b70">at capture time</text>
  <text x="462" y="286" font-family="Arial, sans-serif" font-size="22" fill="#587176">DISPLAYED RATING</text><text x="462" y="365" font-family="Arial, sans-serif" font-size="76" font-weight="700" fill="#17363b">4.9 ★</text><text x="462" y="410" font-family="Arial, sans-serif" font-size="24" fill="#536b70">29,916 linked review records</text>
