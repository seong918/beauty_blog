<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Centellian24 Madeca Cream Time Reverse aggregate review data</title>
  <desc id="desc">A data card showing 4.9 stars from 6,975 Olive Young Korea review records, 49 percent combination skin, 52 percent moisture concern, and 72 percent gentle response, captured August 22, 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f5ed"/><stop offset="1" stop-color="#e8efe2"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#40503a" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1070" cy="92" r="180" fill="#dce8d3" opacity=".65"/>
  <circle cx="90" cy="590" r="160" fill="#eadfcd" opacity=".7"/>
  <text x="72" y="80" font-family="system-ui,-apple-system,sans-serif" font-size="25" font-weight="700" letter-spacing="3" fill="#62715c">RETAIL REVIEW SNAPSHOT</text>
  <text x="72" y="132" font-family="system-ui,-apple-system,sans-serif" font-size="38" font-weight="760" fill="#263126">Centellian24 Madeca Cream Time Reverse</text>
  <g filter="url(#shadow)">
    <rect x="72" y="178" width="340" height="300" rx="24" fill="#fff"/>
    <rect x="438" y="178" width="690" height="142" rx="24" fill="#fff"/>
    <rect x="438" y="338" width="690" height="140" rx="24" fill="#fff"/>
  </g>
  <text x="110" y="245" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="650" fill="#687262">DISPLAYED AVERAGE</text>
  <text x="110" y="352" font-family="system-ui,-apple-system,sans-serif" font-size="106" font-weight="800" fill="#4f6b49">4.9</text>
  <text x="313" y="350" font-family="system-ui,-apple-system,sans-serif" font-size="38" font-weight="700" fill="#a68645">★</text>
  <text x="110" y="430" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#354033">6,975 records</text>
  <text x="474" y="225" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="650" fill="#687262">DISPLAYED REVIEW POLLS</text>
  <text x="474" y="284" font-family="system-ui,-apple-system,sans-serif" font-size="31" font-weight="750" fill="#344232">Combination skin</text>
  <text x="1050" y="284" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="44" font-weight="800" fill="#4f6b49">49%</text>
  <text x="474" y="388" font-family="system-ui,-apple-system,sans-serif" font-size="27" font-weight="720" fill="#344232">Moisture concern</text>
  <text x="734" y="388" font-family="system-ui,-apple-system,sans-serif" font-size="31" font-weight="800" fill="#8d7040">52%</text>
  <text x="474" y="442" font-family="system-ui,-apple-system,sans-serif" font-size="27" font-weight="720" fill="#344232">Gentle response</text>
  <text x="734" y="442" font-family="system-ui,-apple-system,sans-serif" font-size="31" font-weight="800" fill="#4f6b49">72%</text>
  <text x="72" y="548" font-family="system-ui,-apple-system,sans-serif" font-size="21" fill="#5f685c">Captured 2026-08-22 · Polls describe respondent perceptions, not clinical outcomes.</text>
  <text x="72" y="584" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#7a8177">Star-by-star distribution was not reliably exposed, so no distribution is estimated.</text>
</svg>
