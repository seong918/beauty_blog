    <circle cx="365" cy="388" r="11"/><circle cx="420" cy="354" r="7"/><circle cx="474" cy="321" r="14"/><circle cx="525" cy="300" r="6"/><circle cx="570" cy="276" r="10"/><circle cx="620" cy="260" r="5"/><circle cx="668" cy="246" r="9"/><circle cx="716" cy="236" r="4"/><circle cx="760" cy="231" r="7"/>
    <circle cx="452" cy="423" r="5"/><circle cx="510" cy="388" r="9"/><circle cx="565" cy="355" r="4"/><circle cx="618" cy="337" r="12"/><circle cx="675" cy="316" r="6"/><circle cx="730" cy="304" r="9"/><circle cx="784" cy="290" r="5"/><circle cx="835" cy="286" r="11"/>
    <circle cx="554" cy="456" r="8"/><circle cx="612" cy="418" r="4"/><circle cx="671" cy="391" r="10"/><circle cx="731" cy="370" r="6"/><circle cx="790" cy="358" r="12"/><circle cx="852" cy="349" r="5"/><circle cx="910" cy="346" r="8"/>
  </g>
  <g transform="translate(168 265)">
    <rect x="0" y="70" width="155" height="300" rx="45" fill="#f8fbfb" stroke="#6f9fa2" stroke-width="8"/>
