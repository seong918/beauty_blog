<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Brand-neutral facial mist format illustration</title>
  <desc id="desc">An abstract code-drawn spray cloud crossing a pale blue surface. It is not a product photograph or formula reconstruction.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8f7"/><stop offset=".58" stop-color="#d8eeee"/><stop offset="1" stop-color="#b9d7d8"/></linearGradient>
    <radialGradient id="haze"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1200" height="800" rx="38" fill="url(#surface)"/>
  <path d="M-40 620C210 480 470 550 650 420s330-160 600-92v500H-40Z" fill="#a8cfd0" opacity=".36"/>
  <ellipse cx="700" cy="300" rx="360" ry="220" fill="url(#haze)" filter="url(#blur)"/>
