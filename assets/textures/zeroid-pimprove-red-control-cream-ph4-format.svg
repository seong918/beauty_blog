  <text x="80" y="708" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#6d5049">GENERIC CREAM-FORMAT VISUAL</text><text x="80" y="746" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#7e6b65">Code-drawn editorial illustration · not the product, packaging, a sample, or a use test</text>
