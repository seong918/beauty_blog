<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Brand-neutral ampoule and serum-format illustration</title>
  <desc id="desc">An abstract code-drawn illustration of translucent blue liquid layers, falling drops, suspended bubbles, and concentric ripples. It does not depict the AESTURA product or packaging.</desc>
  <defs>
