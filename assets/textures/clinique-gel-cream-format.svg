  <circle cx="265" cy="266" r="50" fill="#fff" fill-opacity=".65" stroke="#c8afbb" stroke-width="3"/>
  <circle cx="900" cy="225" r="35" fill="#fff" fill-opacity=".58" stroke="#9dbfb3" stroke-width="3"/>
