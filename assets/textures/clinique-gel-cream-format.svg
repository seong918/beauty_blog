  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf7fa"/><stop offset=".55" stop-color="#f0e7ec"/><stop offset="1" stop-color="#e2eeea"/></linearGradient>
    <linearGradient id="gel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".94"/><stop offset=".48" stop-color="#e8cfdc" stop-opacity=".68"/><stop offset="1" stop-color="#a9cec0" stop-opacity=".5"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#surface)"/>
