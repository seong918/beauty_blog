<path d="M209 554c100-84 211-129 344-137" fill="none" stroke="#e9ded0" stroke-width="16" stroke-linecap="round" opacity=".7"/><path d="M755 555c85-98 183-155 291-181" fill="none" stroke="#d5f1eb" stroke-width="15" stroke-linecap="round" opacity=".8"/>
<g font-family="system-ui,sans-serif" text-anchor="middle"><text x="408" y="690" font-size="25" font-weight="700" fill="#315d61">RICH CREAM SHAPE</text><text x="914" y="690" font-size="25" font-weight="700" fill="#315d61">GEL-CREAM SHAPE</text><text x="600" y="752" font-size="17" fill="#667477">These shapes do not represent the color, viscosity, finish, or formula of either listing option.</text></g>
