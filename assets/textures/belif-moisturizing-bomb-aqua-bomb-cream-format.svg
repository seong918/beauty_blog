<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Brand-neutral rich cream and gel-cream format illustration</title>
<desc id="desc">Abstract cream dollop and translucent gel-cream sweep on a neutral background, not an actual product image.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef6f2"/><stop offset="1" stop-color="#f7efe1"/></linearGradient><linearGradient id="gel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8ded7" stop-opacity=".9"/><stop offset="1" stop-color="#effaf8" stop-opacity=".6"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#6b817d" flood-opacity=".18"/></filter></defs>
<rect width="1200" height="800" rx="36" fill="url(#bg)"/>
<text x="70" y="82" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#315d61">GENERIC CREAM-FORMAT CONTEXT</text>
<text x="70" y="124" font-family="system-ui,sans-serif" font-size="18" fill="#637174">Abstract illustration only · no product, package, reviewer, or use-test image</text>
