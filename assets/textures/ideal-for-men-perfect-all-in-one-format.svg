    <path d="M340 245 C340 245 292 312 292 350 A48 48 0 0 0 388 350 C388 312 340 245 340 245Z"/>
    <path d="M815 165 C815 165 776 220 776 252 A39 39 0 0 0 854 252 C854 220 815 165 815 165Z"/>
