<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Generic all-in-one lotion-gel format illustration</title>
  <desc id="desc">A brand-neutral code-drawn translucent lotion-gel ribbon and droplets on a muted green-gray background. It is not a product photograph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7ece4"/><stop offset="1" stop-color="#b7c5b2"/></linearGradient>
    <linearGradient id="gel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".88"/><stop offset=".55" stop-color="#dbe7dc" stop-opacity=".62"/><stop offset="1" stop-color="#9db69f" stop-opacity=".42"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="600" cy="660" rx="430" ry="70" fill="#536651" opacity=".18" filter="url(#soft)"/>
  <path d="M210 505 C340 310 475 265 620 340 C760 412 820 350 1000 245 C934 435 837 564 665 590 C498 616 360 570 210 505Z" fill="url(#gel)" stroke="#f8fff8" stroke-opacity=".72" stroke-width="7"/>
