<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Brand-neutral handheld skincare device format illustration</title>
  <desc id="desc">An abstract code-drawn handheld skincare device silhouette with charging, manual, cleaning, and warranty symbols. It is not the actual product or an engineering diagram.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e8f3f4"/><stop offset="1" stop-color="#d8dbe5"/></linearGradient><linearGradient id="device" x1="0" x2="1"><stop stop-color="#fdfefe"/><stop offset=".5" stop-color="#d9e7e9"/><stop offset="1" stop-color="#a6c5ca"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#23484e" flood-opacity=".2"/></filter></defs>
  <rect width="1200" height="800" fill="url(#bg)"/><circle cx="220" cy="150" r="180" fill="#fff" opacity=".3"/><circle cx="1030" cy="620" r="240" fill="#fff" opacity=".24"/>
