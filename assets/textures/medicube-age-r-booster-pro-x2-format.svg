  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" fill="#2b4247"><text x="70" y="88" font-size="26" font-weight="700" letter-spacing="2">GENERIC DEVICE FORMAT</text><text x="70" y="137" font-size="36" font-weight="800">Verify the exact option and manual</text>
    <g transform="translate(70 250)"><rect width="250" height="92" rx="18" fill="#fff" opacity=".82"/><text x="24" y="38" font-size="19" font-weight="700">CHARGING</text><text x="24" y="68" font-size="16">Power and regional plug</text></g>
    <g transform="translate(70 365)"><rect width="250" height="92" rx="18" fill="#fff" opacity=".82"/><text x="24" y="38" font-size="19" font-weight="700">DIRECTIONS</text><text x="24" y="68" font-size="16">Modes and contraindications</text></g>
    <g transform="translate(880 250)"><rect width="250" height="92" rx="18" fill="#fff" opacity=".82"/><text x="24" y="38" font-size="19" font-weight="700">CARE</text><text x="24" y="68" font-size="16">Cleaning and storage</text></g>
    <g transform="translate(880 365)"><rect width="250" height="92" rx="18" fill="#fff" opacity=".82"/><text x="24" y="38" font-size="19" font-weight="700">OWNERSHIP</text><text x="24" y="68" font-size="16">Warranty and returns</text></g>
    <text x="70" y="742" font-size="20">Abstract illustration · not the actual device, accessory set, output, or engineering diagram</text>
