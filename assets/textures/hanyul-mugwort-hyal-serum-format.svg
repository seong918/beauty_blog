  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1f3e7"/><stop offset="1" stop-color="#d8dfc8"/></linearGradient>
    <linearGradient id="serum" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".9"/><stop offset=".55" stop-color="#dbe7c9" stop-opacity=".7"/><stop offset="1" stop-color="#9eb581" stop-opacity=".42"/></linearGradient>
