<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Brand-neutral cream-format illustration</title>
  <desc id="desc">An abstract ivory cream ribbon and soft translucent shapes on a muted green background. This is not the actual product or formula.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dce5ce"/><stop offset="1" stop-color="#f3ecdf"/></linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf7"/><stop offset=".58" stop-color="#f3eadb"/><stop offset="1" stop-color="#d9cbb7"/></linearGradient>
    <radialGradient id="shine"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#4a5437" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="800" rx="40" fill="url(#bg)"/>
  <ellipse cx="600" cy="620" rx="440" ry="92" fill="#7f8d67" opacity=".17" filter="url(#soft)"/>
  <g filter="url(#drop)">
    <path d="M230 545c115-44 167-123 263-188 113-76 250-118 370-62 93 44 145 137 107 211-31 61-114 71-173 46-78-33-98-102-165-107-64-5-102 49-151 88-78 63-172 83-251 12z" fill="url(#cream)"/>
    <path d="M309 493c102-39 153-111 244-155 95-47 198-54 281-14" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="25" stroke-linecap="round"/>
  </g>
  <ellipse cx="475" cy="348" rx="215" ry="115" fill="url(#shine)" opacity=".62" transform="rotate(-19 475 348)"/>
  <circle cx="933" cy="170" r="80" fill="#fff" opacity=".32"/>
  <circle cx="1020" cy="280" r="37" fill="#fff" opacity=".36"/>
  <circle cx="175" cy="225" r="56" fill="#fff" opacity=".24"/>
  <text x="600" y="727" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#526043" letter-spacing="2">GENERIC CREAM-FORMAT STUDY</text>
</svg>
