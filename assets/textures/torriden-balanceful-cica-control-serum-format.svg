  <g fill="url(#drop)" stroke="#6f9e84" stroke-width="3">
    <path d="M470 190 C470 190 402 292 402 342 C402 390 432 420 470 420 C508 420 538 390 538 342 C538 292 470 190 470 190Z"/>
    <path d="M685 110 C685 110 625 202 625 247 C625 290 652 317 685 317 C719 317 746 290 746 247 C746 202 685 110 685 110Z"/>
