    <linearGradient id="gel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9ddc8" stop-opacity=".9"/><stop offset="1" stop-color="#6ba887" stop-opacity=".55"/></linearGradient>
    <radialGradient id="drop"><stop stop-color="#ffffff" stop-opacity=".92"/><stop offset=".55" stop-color="#bfe2cf" stop-opacity=".8"/><stop offset="1" stop-color="#6d9f84" stop-opacity=".5"/></radialGradient>
  </defs>
  <rect width="1200" height="800" rx="36" fill="url(#bg)"/>
  <ellipse cx="600" cy="620" rx="420" ry="96" fill="#b9d8c6" opacity=".45"/>
