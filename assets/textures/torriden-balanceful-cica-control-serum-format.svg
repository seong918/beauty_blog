  </g>
  <text x="600" y="735" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#557264">BRAND-NEUTRAL SERUM-FORMAT VISUAL · NOT A PRODUCT IMAGE</text>
