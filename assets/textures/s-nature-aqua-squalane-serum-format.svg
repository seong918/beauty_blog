<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Generic lightweight serum-format illustration</title>
  <desc id="desc">A brand-neutral code-drawn translucent serum ribbon and droplets on a pale background. It does not depict the actual product.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faf5"/><stop offset="1" stop-color="#e7eee2"/></linearGradient>
    <linearGradient id="serum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#dce9dd" stop-opacity=".72"/><stop offset=".5" stop-color="#9fbca7" stop-opacity=".9"/><stop offset="1" stop-color="#6e927a" stop-opacity=".68"/></linearGradient>
    <radialGradient id="drop"><stop stop-color="#fff" stop-opacity=".94"/><stop offset=".55" stop-color="#b9d3c0" stop-opacity=".76"/><stop offset="1" stop-color="#6e927a" stop-opacity=".55"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#526b59" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <text x="70" y="92" fill="#687366" font-family="system-ui, sans-serif" font-size="23" font-weight="700" letter-spacing="3">GENERIC SERUM FORMAT</text>
  <g filter="url(#shadow)">
    <path d="M118 447 C250 344 408 337 584 388 C744 434 906 423 1080 348 C957 506 780 557 583 508 C401 462 245 492 118 447 Z" fill="url(#serum)" stroke="#789985" stroke-opacity=".42" stroke-width="4"/>
    <ellipse cx="348" cy="322" rx="78" ry="61" fill="url(#drop)"/>
    <ellipse cx="825" cy="287" rx="48" ry="38" fill="url(#drop)"/>
    <ellipse cx="935" cy="557" rx="29" ry="23" fill="url(#drop)"/>
  </g>
  <path d="M300 305 C327 281 364 278 391 300" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="12" stroke-linecap="round"/>
  <path d="M799 277 C814 264 835 262 850 274" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="8" stroke-linecap="round"/>
  <text x="70" y="725" fill="#657066" font-family="system-ui, sans-serif" font-size="22">Illustrative only · no product package, shopper photo, or tested texture shown</text>
</svg>
