  <circle cx="910" cy="180" r="58" fill="url(#drop)"/><circle cx="315" cy="245" r="34" fill="url(#drop)"/><circle cx="965" cy="315" r="24" fill="url(#drop)"/>
  <text x="600" y="748" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#315f51">BRAND-NEUTRAL SERUM FORMAT · NOT A PRODUCT SWATCH</text>
