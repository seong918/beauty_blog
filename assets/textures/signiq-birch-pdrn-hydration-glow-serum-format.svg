    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="610" cy="665" rx="430" ry="70" fill="#5d9d85" opacity=".2" filter="url(#soft)"/>
