    <radialGradient id="bubble" cx="35%" cy="28%"><stop stop-color="#fff" stop-opacity=".95"/><stop offset=".55" stop-color="#dff7fb" stop-opacity=".55"/><stop offset="1" stop-color="#5ba5ba" stop-opacity=".2"/></radialGradient>
