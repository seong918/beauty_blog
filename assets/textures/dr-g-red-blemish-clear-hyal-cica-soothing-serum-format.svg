<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Brand-neutral serum format illustration</title>
  <desc id="desc">An abstract code-drawn composition of translucent aqua serum droplets and a lightweight ribbon on a pale background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3faf8"/><stop offset="1" stop-color="#e8f1f6"/></linearGradient>
    <linearGradient id="serum" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a9e5d9" stop-opacity=".88"/><stop offset=".55" stop-color="#84cbd2" stop-opacity=".7"/><stop offset="1" stop-color="#74acd0" stop-opacity=".78"/></linearGradient>
    <radialGradient id="drop" cx="35%" cy="25%" r="70%"><stop stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#bfeee6" stop-opacity=".82"/><stop offset="1" stop-color="#6cb2c5" stop-opacity=".74"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#497c89" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1200" height="800" rx="42" fill="url(#bg)"/>
  <ellipse cx="610" cy="620" rx="400" ry="70" fill="#6f9fac" opacity=".12" filter="url(#blur)"/>
  <path d="M170 500 C320 300 445 620 620 420 S900 230 1040 380" fill="none" stroke="url(#serum)" stroke-width="105" stroke-linecap="round" opacity=".72" filter="url(#shadow)"/>
  <path d="M190 472 C350 318 455 575 625 398 S892 260 1018 372" fill="none" stroke="#eefcfb" stroke-width="16" stroke-linecap="round" opacity=".74"/>
  <path d="M770 150 C850 250 858 326 770 390 C682 326 690 250 770 150Z" fill="url(#drop)" filter="url(#shadow)"/>
  <ellipse cx="742" cy="227" rx="22" ry="40" fill="#fff" opacity=".62" transform="rotate(25 742 227)"/>
  <circle cx="355" cy="215" r="72" fill="url(#drop)" opacity=".9" filter="url(#shadow)"/>
  <ellipse cx="330" cy="191" rx="16" ry="25" fill="#fff" opacity=".66" transform="rotate(28 330 191)"/>
  <circle cx="935" cy="575" r="44" fill="url(#drop)" opacity=".82"/>
  <circle cx="250" cy="615" r="30" fill="url(#drop)" opacity=".72"/>
  <text x="600" y="710" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="2" fill="#4c6e78">BRAND-NEUTRAL SERUM FORMAT</text>
  <text x="600" y="750" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#687f87">Abstract illustration · not the product · not evidence of a texture test</text>
</svg>
