<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Brand-neutral dropper serum format illustration</title>
  <desc id="desc">A code-drawn unbranded dropper bottle beside translucent serum-like drops. It does not depict the real product or formula.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8f5fb"/><stop offset="1" stop-color="#edf7f3"/></linearGradient>
    <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#d9d0e4" stop-opacity=".74"/><stop offset=".55" stop-color="#fff" stop-opacity=".92"/><stop offset="1" stop-color="#c3d8cf" stop-opacity=".72"/></linearGradient>
    <radialGradient id="drop"><stop stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#b8d6ca" stop-opacity=".7"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3b4a45" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="800" rx="30" fill="url(#canvas)"/>
  <ellipse cx="590" cy="690" rx="345" ry="54" fill="#71847c" opacity=".14"/>
  <g filter="url(#shadow)">
    <rect x="382" y="236" width="330" height="410" rx="52" fill="url(#glass)" stroke="#8fa79d" stroke-width="6"/>
    <rect x="440" y="158" width="214" height="114" rx="25" fill="#4f4a58"/>
    <rect x="485" y="92" width="124" height="95" rx="52" fill="#696271"/>
    <path d="M547 272v235" stroke="#59635f" stroke-width="22" stroke-linecap="round" opacity=".72"/>
    <path d="M547 500c-28 42-32 71 0 96 32-25 28-54 0-96Z" fill="url(#drop)" stroke="#91afa3" stroke-width="4"/>
    <rect x="426" y="358" width="242" height="150" rx="14" fill="#fff" opacity=".82"/>
    <text x="547" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#4e5552">SERUM</text>
    <text x="547" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#6a7470">FORMAT STUDY</text>
  </g>
  <g fill="url(#drop)" stroke="#91afa3" stroke-width="4">
    <path d="M835 410c-52 77-60 132 0 178 60-46 52-101 0-178Z"/>
    <path d="M920 506c-30 44-35 76 0 103 35-27 30-59 0-103Z"/>
  </g>
  <text x="600" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#5f6c67">Generic editorial illustration · not product photography</text>
</svg>
