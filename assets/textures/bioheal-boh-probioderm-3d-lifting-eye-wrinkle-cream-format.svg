    <path d="M245 502c96-112 263-155 437-120 115 23 193 67 218 118-85-28-178-19-276 30-122 61-238 72-379-28Z" fill="#fffdf9" opacity=".93"/>
    <path d="M343 540c88-84 207-113 339-82 78 18 137 49 179 90-95-12-169 2-244 43-96 52-185 47-274-51Z" fill="#e4d2d4" opacity=".72"/>
