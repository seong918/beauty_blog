<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Brand-neutral cream-format illustration</title>
  <desc id="desc">An abstract code-drawn arrangement of soft cream-colored ribbons on a muted plum background. It does not depict the BIOHEAL BOH product or a real swatch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#4b354c"/><stop offset="1" stop-color="#8c6684"/></linearGradient>
    <linearGradient id="cream" x1="0" x2=".8" y1="0" y2="1"><stop stop-color="#fffdf8"/><stop offset=".55" stop-color="#f3e9df"/><stop offset="1" stop-color="#d9c6c6"/></linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#241827" flood-opacity=".34"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1040" cy="105" r="230" fill="#d8b7ce" opacity=".17"/><circle cx="120" cy="745" r="260" fill="#ced8bd" opacity=".13"/>
