<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Brand-neutral ointment-gel format illustration</title>
  <desc id="desc">An abstract translucent gel ribbon and small rounded bead forms on a pale green surface; not a product photograph or formula simulation.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbf8"/><stop offset="1" stop-color="#dcebe4"/></linearGradient>
