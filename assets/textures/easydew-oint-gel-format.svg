  <circle cx="276" cy="273" r="48" fill="#fff" fill-opacity=".6" stroke="#a2c1b6" stroke-width="3"/>
  <circle cx="915" cy="222" r="32" fill="#fff" fill-opacity=".56" stroke="#a2c1b6" stroke-width="3"/>
