    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#surface)"/>
  <ellipse cx="605" cy="605" rx="390" ry="70" fill="#7b9d91" opacity=".16" filter="url(#shadow)"/>
