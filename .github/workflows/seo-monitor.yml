name: Weekly SEO health monitor

on:
  schedule:
    # Sundays at 09:00 Asia/Seoul.
    - cron: "0 0 * * 0"
    # One-time checkpoint: 2026-07-28 08:00 Asia/Seoul.
    # The checkpoint script is idempotent, so later annual triggers are no-ops.
    - cron: "0 23 27 7 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check public SEO surface
        id: seo_check
        continue-on-error: true
        env:
          SEO_REPORT_PATH: seo-report.md
        run: node scripts/check-seo.mjs

      - name: Create due Search Console checkpoint
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SEO_REPORT_PATH: seo-report.md
        run: node scripts/create-seo-checkpoint.mjs

      - name: Fail when the public SEO check failed
        if: steps.seo_check.outcome == 'failure'
        run: exit 1
